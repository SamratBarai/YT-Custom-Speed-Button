<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    :root {
      --bg-color: #ffffff;
      --text-color: #0f0f0f;
      --border-color: #e5e5e5;
      --accent-color: #cc0000;
      --button-bg-hover: #f2f2f2;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg-color: #0f0f0f;
        --text-color: #f1f1f1;
        --border-color: #2f2f2f;
        --accent-color: #ff0000;
        --add-btn-hover: #ff0000bb;
        --button-bg-hover: #272727;
      }
    }
    
    body {
      font-family: "Roboto", "Arial", sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 12px;
      height: 180px;
      width: 320px;
      box-sizing: border-box;
    }
    h3 {
      margin: 0 0 10px 0;
      font-size: 14px;
      font-weight: 500;
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 8px;
    }
    .speed-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 12px;
      max-height: 150px;
      overflow-y: auto;
    }
    .speed-tag {
      display: inline-flex;
      align-items: center;
      background: var(--button-bg-hover);
      padding: 4px 8px;
      border-radius: 12px;
      font-size: 12px;
    }
    .speed-tag span {
      margin-right: 6px;
    }
    .speed-tag button {
      background: none;
      border: none;
      color: var(--accent-color);
      cursor: pointer;
      font-weight: bold;
      padding: 0;
    }
    .input-group {
      display: flex;
      gap: 6px;
    }
    input[type="number"] {
      flex: 1;
      background: var(--bg-color);
      border: 2px solid var(--border-color);
      outline: none;
      color: var(--text-color);
      padding: 6px;
      border-radius: 4px;
      font-size: 12px;
    }
    button.add-btn {
      background: var(--accent-color);
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
    }
    button.add-btn:hover {
      background: var(--add-btn-hover);
    }
  </style>
</head>
<body>
  <h3>Custom Speed Values</h3>
  <div class="speed-list" id="speedList"></div>
  <div class="input-group">
    <input type="number" id="newSpeed" step="0.05" min="0.1" max="16" placeholder="e.g. 2.25">
    <button class="add-btn" id="addBtn">Add</button>
  </div>
  <script src="popup.js"></script>
</body>
</html>
